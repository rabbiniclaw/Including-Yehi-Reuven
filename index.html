<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבר לאתר החדש - מכירה סינית יחי ראובן</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 18px;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>עברנו לאתר החדש שלנו!</h1>
        <p>לחצו על הכפתור למטה כדי לעבור לכתובת החדשה:</p>
        <!-- הקישור עצמו עם הגדרה שיפתח בלשונית חדשה (target="_blank") -->
        <a href="https://chinese-auction.ai.studio" target="_blank" class="btn">עברו לאתר החדש שלנו</a>
    </div>

</body>
</html>
